<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive">
<title>ふしぎな世界と4匹のともだち</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#1c1b3a;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;overflow:hidden}
#g{position:relative;height:100%;max-width:520px;margin:auto;overflow:hidden;color:#fff}
#bg{position:absolute;inset:0;transition:background .6s}
.sp{animation:sp 40s linear infinite;transform-box:fill-box;transform-origin:center}.sp.r{animation-direction:reverse}@keyframes sp{to{transform:rotate(360deg)}}#bg svg *{will-change:auto}#deco{position:absolute;top:13%;left:0;right:0;display:flex;justify-content:space-around;font-size:34px;opacity:.7;animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.35;transform:translateY(-4px)}}
#cs{position:absolute;left:0;right:0;padding:0 6px;bottom:41%;display:flex;justify-content:center;align-items:flex-end;gap:2px}
#cs svg,#cs img{animation:bob 2.2s ease-in-out infinite}
#cs.big>*{width:46%!important;max-height:34vh;object-fit:contain}.pop{animation:pop .6s!important}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.D,.d,.T,.M{height:auto;min-width:0;flex:0 1 auto;object-fit:contain;filter:drop-shadow(0 4px 6px #0006)}.D{width:38%}.d{width:25%}.T{width:16%}.M{width:19%}
#top{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0;z-index:5}
#top button{flex:1;padding:8px 2px;font-size:13px;border:0;border-radius:14px;background:#ffffff88;color:#3a3560;font-family:inherit}
#top button.on{background:#ffd86b}
#win{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);min-height:36%;max-height:60%;background:#2a2850b8;border:2px solid #ffffff90;border-radius:20px;padding:12px 16px;backdrop-filter:blur(4px);display:flex;flex-direction:column;z-index:4}
#nm{font-weight:bold;color:#ffd86b;font-size:15px;min-height:20px}
#tx{font-size:17px;line-height:1.75;flex:1;overflow:auto;white-space:pre-wrap}
#nx{position:absolute;right:16px;bottom:8px;animation:bob 1s infinite}
#chs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#chs button,.bt{padding:13px 10px;font-size:16px;border:0;border-radius:16px;background:linear-gradient(#fff,#ffe3f1);color:#4a3470;font-weight:bold;font-family:inherit;box-shadow:0 3px 0 #c79bd6}
#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.ov{position:absolute;inset:0;z-index:15;background:#1c1b3aee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.ov .bt{width:80%}
.ov h1{font-size:25px;line-height:1.5;margin:0;color:#ffe9a8;text-shadow:0 0 14px #ff9ed2}
.ov input,.ov select{font-size:17px;padding:10px;border-radius:12px;border:0;width:80%;font-family:inherit;text-align:center}
.hid{display:none!important}
#fin{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#00000055;animation:fi 2s}
@keyframes fi{from{opacity:0}}
#fin h2{font-size:30px;margin:0;color:#fff7c2;text-align:center;line-height:1.5;text-shadow:0 0 18px #ff7ab8,0 0 30px #ffd86b;animation:pulse 2s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.ml{opacity:0;animation:fi2 1.6s forwards}@keyframes fi2{to{opacity:1}}.cf{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards;z-index:13;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#items div{background:#ffffff22;border-radius:12px;padding:10px;width:80%}
</style></head><body>
<div id="g">
<div id="bg"></div><div id="deco"></div><div id="cs"></div>
<div id="top"><button id="bI">アイテム</button><button id="bS">スキップ</button><button id="bM">♪ OFF</button><button id="bO">せってい</button></div>
<div id="win"><div id="nm"></div><div id="tx"></div><div id="nx">▼</div><div id="chs"></div></div>
<div id="fade"></div>
<div id="title" class="ov"><div style="font-size:50px">🌙⭐🌙</div><h1>ふしぎな世界と<br>4匹のともだち</h1>
<button class="bt" id="bN">はじめから</button><button class="bt" id="bC">つづきから</button><button class="bt" id="bT">せってい</button></div>

<div>あなたの名前</div><input id="inN" maxlength="8" value="なずみ">

let F={},I=[],seen={},cs="p1",cur=[],li=0,typing=false,tm=null,busy=false,skipOn=false,curSeen=false,prevCh=[],bgm=false,mem=null,cfg={n:"なずみ",sp:35};
const $=i=>document.getElementById(i);
const K="fshg_v1";
function sv_(){const o=JSON.stringify({cs,F,I,seen,cfg});try{localStorage.setItem(K,o)}catch(e){mem=o}}
function ld(){try{const r=localStorage.getItem(K)||mem;return r?JSON.parse(r):null}catch(e){return mem?JSON.parse(mem):null}}
const has=k=>F[k]||I.includes(k);
const ok=c=>!c||c.split("&").every(x=>x[0]=="!"?!has(x.slice(1)):has(x));
const sub=t=>t.replace(/\{n\}/g,cfg.n);
function eff(s){if(s.set)s.set.split(",").forEach(k=>F[k]=1);if(s.get)s.get.split(",").forEach(k=>{if(!I.includes(k)){I.push(k);toast(IT[k])}})}
function toast(t){}
function go(id,instant){if(!S[id]){console.warn("undef",id);id="p1"}
 if(busy)return;busy=true;const f=$("fade");f.style.opacity=instant?0:1;
 setTimeout(()=>{cs=id;li=0;const s=S[id];eff(s);cur=s.L.filter(x=>typeof x=="string"||ok(x[0])).map(x=>typeof x=="string"?x:x[1]);
 const b=BG[s.bg.slice(0,4)]||BG[s.bg]||BG.room;$("bg").style.background=b[0];$("bg").innerHTML=BGF(s.bg);$("deco").textContent="";
 $("cs").classList.remove("big");const ch=s.ch||[];$("cs").innerHTML=ch.map(k=>sv(k)).join("");
 [...$("cs").children].forEach((e,i)=>{if(!prevCh.includes(ch[i]))e.classList.add("pop")});prevCh=ch;

 const key=cs+":"+li;curSeen=!!seen[key];seen[key]=1;$("nm").textContent=nm;$("chs").innerHTML="";
 typing=true;let i=0;$("nx").style.visibility="hidden";$("tx").textContent="";
 tm=setInterval(()=>{i++;$("tx").textContent=t.slice(0,i);if(i>=t.length)fin(t)},curSeen&&skipOn?1:cfg.sp)}

 const s=S[cs];const last=li>=cur.length-1;
 if(last&&s.c){choices();skipOff()}else if(last&&s.end){setTimeout(finale,900);skipOff()}else $("nx").style.visibility="visible"}

function choices(){const box=$("chs");box.innerHTML="";
 S[cs].c.filter(c=>ok(c.if)).forEach(c=>{const b=document.createElement("button");b.textContent=c.t;
 b.onclick=e=>{e.stopPropagation();if(busy)return;if(c.msg){const m=sub(c.msg).match(/^([\s\S]*?)(?:\n([DdTMN])\|([\s\S]*))?$/);
 const mm=sub(c.msg).match(/([DdTMN])\|([\s\S]*)$/);if(mm){$("nm").textContent=mm[1]=="N"?cfg.n:NM[mm[1]];$("tx").textContent=mm[2]}else $("tx").textContent=sub(c.msg);return}
 eff(c);go(c.to)};box.appendChild(b)})}
function adv(){if(busy||!$("title").classList.contains("hid"))return;if(typing){finTxt();return}
 const s=S[cs];if(li<cur.length-1){li++;show();return}
 if(s.n)go(s.n)}
